name: VM2 title transition checks

on:
  pull_request:
    branches:
      - title-target

permissions:
  contents: read

jobs:
  hold:
    name: vm2-title-hold
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Hold synthetic queue checks
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.head_ref }}" == mergify/merge-queue/* ]]; then sleep 75; fi

  security:
    name: vm2-title-security
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
