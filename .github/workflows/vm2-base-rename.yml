name: VM2 rename policy crossover checks

on:
  pull_request:
    branches:
      - policy-old
      - policy-new

permissions:
  contents: read

jobs:
  hold:
    name: vm2-base-rename-hold
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Hold only synthetic queue checks
        shell: bash
        run: |
          set -euo pipefail
          echo "head_ref=${{ github.head_ref }}"
          if [[ "${{ github.head_ref }}" == mergify/merge-queue/* ]]; then
            echo VM2_POLICY_CROSSOVER_HOLD_START
            sleep 75
            echo VM2_POLICY_CROSSOVER_HOLD_END
          fi

  new-security:
    name: vm2-new-security
    runs-on: ubuntu-latest
    steps:
      - name: Deliberate failing policy discriminator
        run: |
          echo VM2_POLICY_CROSSOVER_SECURITY_FAILURE
          exit 1
