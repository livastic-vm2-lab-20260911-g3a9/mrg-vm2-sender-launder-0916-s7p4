name: VM2 head rename policy checks

on:
  pull_request:
    branches:
      - headrename-target

permissions:
  contents: read

jobs:
  hold:
    name: vm2-headrename-hold
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Hold only synthetic queue checks
        shell: bash
        run: |
          set -euo pipefail
          echo "head_ref=${{ github.head_ref }}"
          if [[ "${{ github.head_ref }}" == mergify/merge-queue/* ]]; then
            echo VM2_HEAD_RENAME_HOLD_START
            sleep 75
            echo VM2_HEAD_RENAME_HOLD_END
          fi

  security:
    name: vm2-headrename-security
    runs-on: ubuntu-latest
    steps:
      - name: Deliberate strict-policy failure
        run: |
          echo VM2_HEAD_RENAME_SECURITY_FAILURE
          exit 1
