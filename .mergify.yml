merge_queue:
  mode: serial
  max_parallel_checks: 1

queue_rules:
  - name: VM2 weak old-title policy
    batch_size: 1
    queue_conditions:
      - base = title-target
      - title = VM2_TITLE_OLD
      - check-success = vm2-title-hold
    merge_conditions:
      - check-success = vm2-title-hold
    merge_method: merge

  - name: VM2 strict new-title policy
    batch_size: 1
    queue_conditions:
      - base = title-target
      - title = VM2_TITLE_NEW
      - check-success = vm2-title-hold
    merge_conditions:
      - check-success = vm2-title-hold
      - check-success = vm2-title-security
    merge_method: merge

merge_protections_settings:
  auto_merge_conditions: true

pull_request_rules: []
