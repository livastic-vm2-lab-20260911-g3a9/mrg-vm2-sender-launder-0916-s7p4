merge_queue:
  mode: serial
  max_parallel_checks: 1

queue_rules:
  - name: VM2 protected base-rename autoqueue
    batch_size: 1
    queue_conditions:
      - base = protected-old
      - check-success = vm2-base-rename-hold
    merge_conditions:
      - check-success = vm2-base-rename-hold
    merge_method: merge

merge_protections_settings:
  auto_merge_conditions: true

pull_request_rules: []
