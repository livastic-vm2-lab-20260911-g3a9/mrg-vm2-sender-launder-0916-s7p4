pull_request_rules:
  - name: VM2 dual status/check collision merge sink
    conditions:
      - base = dual-collision-base
      - title = VM2_DUAL_CHECK_STATUS_COLLISION
      - label = vm2-dual-collision-go
    actions:
      merge:
        method: merge
        merge_bot_account: livastic-vm2-primary-20260911

scopes:
  source:
    files:
      security-critical:
        include:
          - security/**
  capacities:
    "security-*": 1

commands_restrictions:
  copy:
    conditions:
      - sender = livastic-vm2-secondary-20260911
      - scope != security-*
