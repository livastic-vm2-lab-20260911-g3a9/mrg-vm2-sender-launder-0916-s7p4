scopes:
  source:
    files:
      critical:
        include:
          - "safe/**"
pull_request_rules:
  - name: VM2 scope config-change guard sentinel
    conditions:
      - title = VM2_SCOPE_GUARD_SENTINEL
      - -mergify-configuration-changed
    actions:
      comment:
        message: VM2_SCOPE_GUARD_SENTINEL_FIRED
