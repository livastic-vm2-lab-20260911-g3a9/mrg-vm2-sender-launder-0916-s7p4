merge_queue:
  mode: serial
  max_parallel_checks: 1

queue_rules:
  - name: VM2 weak old-head policy
    batch_size: 1
    queue_conditions:
      - base = headrename-target
      - head = head-old
      - check-success = vm2-headrename-hold
    merge_conditions:
      - check-success = vm2-headrename-hold
    merge_method: merge

  - name: VM2 strict new-head policy
    batch_size: 1
    queue_conditions:
      - base = headrename-target
      - head = head-new
      - check-success = vm2-headrename-hold
    merge_conditions:
      - check-success = vm2-headrename-hold
      - check-success = vm2-headrename-security
    merge_method: merge

merge_protections_settings:
  auto_merge_conditions: true

pull_request_rules: []
